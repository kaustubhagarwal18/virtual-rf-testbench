<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Limitations</title>
  <desc id="desc">Four limitations. Small and easy data: 9 faults, each seen before, and 6 of them have nothing to vary, so their questions repeat a past run; the majority vote's 9 of 9 shows recall, not reasoning. One model, one seed: qwen2.5:3b at temperature 0 on an 8 GB laptop. link_down gets no action with past runs: the model answers UNKNOWN. Simulated instruments, not real hardware.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .bar { fill: #d4a72c; }
      .big { font-size: 26px; font-weight: 800; fill: #9a6700; }
      .unit { font-size: 11.5px; fill: #59636e; }
      .head { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .body { font-size: 11.5px; fill: #59636e; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #161b22; stroke: #30363d; }
        .bar { fill: #9e6a03; }
        .big { fill: #d29922; }
        .unit, .body { fill: #9198a1; }
        .head { fill: #e6edf3; }
      }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="16" width="206" height="168" rx="14" class="panel"/>
    <rect x="238" y="16" width="206" height="168" rx="14" class="panel"/>
    <rect x="456" y="16" width="206" height="168" rx="14" class="panel"/>
    <rect x="674" y="16" width="206" height="168" rx="14" class="panel"/>
  </g>
  <rect x="20" y="16" width="206" height="5" rx="2.5" class="bar"/>
  <rect x="238" y="16" width="206" height="5" rx="2.5" class="bar"/>
  <rect x="456" y="16" width="206" height="5" rx="2.5" class="bar"/>
  <rect x="674" y="16" width="206" height="5" rx="2.5" class="bar"/>

  <!-- data -->
  <text x="38" y="64" class="big">6 of 9</text>
  <text x="38" y="84" class="unit">faults repeat a past run</text>
  <text x="38" y="116" class="head">Small, easy data</text>
  <text x="38" y="138" class="body">9 faults, each seen before.</text>
  <text x="38" y="155" class="body">The vote's 9 of 9 is recall,</text>
  <text x="38" y="172" class="body">not reasoning.</text>

  <!-- model -->
  <text x="256" y="64" class="big">1 seed</text>
  <text x="256" y="84" class="unit">temperature 0, one machine</text>
  <text x="256" y="116" class="head">One small model</text>
  <text x="256" y="138" class="body">qwen2.5:3b on an 8 GB laptop.</text>
  <text x="256" y="155" class="body">A one-fault difference may</text>
  <text x="256" y="172" class="body">be noise.</text>

  <!-- link_down -->
  <text x="474" y="64" class="big">UNKNOWN</text>
  <text x="474" y="84" class="unit">on link_down, with past runs</text>
  <text x="474" y="116" class="head">One fault unanswered</text>
  <text x="474" y="138" class="body">The model wants ALIGNMENT;</text>
  <text x="474" y="155" class="body">a check refuses it. The vote</text>
  <text x="474" y="172" class="body">would say LINK.</text>

  <!-- simulated -->
  <text x="692" y="64" class="big">0</text>
  <text x="692" y="84" class="unit">real instruments</text>
  <text x="692" y="116" class="head">Simulated bench</text>
  <text x="692" y="138" class="body">SCPI simulators play the</text>
  <text x="692" y="155" class="body">firmware; noise and errors</text>
  <text x="692" y="172" class="body">are modelled, not measured.</text>
</svg>
