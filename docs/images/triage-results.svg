<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 792" width="900" height="792" role="img" aria-labelledby="title desc">
  <title id="title">Triage results: faults solved out of 9</title>
  <desc id="desc">Faults solved out of 9, with 95% intervals, and confident wrong answers out of 27, for each scenario. Without retrieval: error only 3, full evidence 7, full evidence without the firmware line 6, without the no-signal line 5. With retrieval: 6, with checks 6, with checks and gates 5. The same precedents answered by majority vote, with no model: 9, and 6 with checks and gates, with no wrong answers. With the question's own fault held out: with checks 4 (the vote 4), with checks and gates 1 (the vote 2, with no wrong answers).</desc>
  <defs>
    <linearGradient id="barBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8957e5"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="barRag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="barVote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a7f37"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="barHeld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a72c"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .heading { font-size: 17px; font-weight: 700; fill: #1f2328; }
      .caption { font-size: 12.5px; fill: #59636e; }
      .group { font-size: 11px; font-weight: 700; fill: #59636e; letter-spacing: 0.08em; }
      .name { font-size: 13.5px; font-weight: 600; fill: #1f2328; }
      .note { font-size: 11.5px; fill: #59636e; }
      .track { fill: #f6f8fa; stroke: #eaeef2; stroke-width: 1; }
      .tick { stroke: #eaeef2; stroke-width: 1; }
      .whisker { stroke: #1f2328; stroke-width: 1.4; opacity: 0.55; }
      .value { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .wrong { font-size: 13px; font-weight: 600; fill: #cf222e; }
      .wrong-zero { font-size: 13px; font-weight: 600; fill: #1a7f37; }
      .colhead { font-size: 11px; font-weight: 600; fill: #59636e; }
      .axis { font-size: 10.5px; fill: #8c959f; }
      .rule { stroke: #eaeef2; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #161b22; stroke: #30363d; }
        .heading, .name, .value { fill: #e6edf3; }
        .caption, .group, .note, .colhead { fill: #9198a1; }
        .track { fill: #21262d; stroke: #30363d; }
        .tick, .rule { stroke: #30363d; }
        .whisker { stroke: #e6edf3; }
        .wrong { fill: #ff7b72; }
        .wrong-zero { fill: #56d364; }
        .axis { fill: #6e7681; }
      }
    </style>
  </defs>

  <g filter="url(#shadow)"><rect x="20" y="16" width="860" height="760" rx="18" class="panel"/></g>

  <text x="48" y="54" class="heading">Faults solved, out of 9</text>
  <text x="48" y="76" class="caption">A fault is solved when all three of its questions are right. The thin line is the 95% interval.</text>

  <!-- column heads and axis -->
  <text x="330" y="108" class="colhead">FAULTS SOLVED</text>
  <text x="776" y="108" class="colhead">WRONG, OF 27</text>
  <g class="axis" text-anchor="middle">
    <text x="330" y="124">0</text><text x="430" y="124">3</text><text x="530" y="124">6</text><text x="630" y="124">9</text>
  </g>

  <!-- ===== Without retrieval ===== -->
  <text x="48" y="150" class="group">WITHOUT RETRIEVAL</text>

  <text x="48" y="178" class="name">Error message only</text>
  <rect x="330" y="164" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="164" width="100" height="20" rx="10" fill="url(#barBase)"/>
  <line x1="363.3" y1="174" x2="530" y2="174" class="whisker"/>
  <text x="644" y="179" class="value">3</text>
  <text x="776" y="179" class="wrong">18</text>

  <text x="48" y="214" class="name">Full evidence</text>
  <rect x="330" y="200" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="200" width="233.3" height="20" rx="10" fill="url(#barBase)"/>
  <line x1="463.3" y1="210" x2="596.7" y2="210" class="whisker"/>
  <text x="644" y="215" class="value">7</text>
  <text x="776" y="215" class="wrong">6</text>

  <text x="48" y="250" class="name">Full evidence, no version line</text>
  <rect x="330" y="236" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="236" width="200" height="20" rx="10" fill="url(#barBase)" opacity="0.55"/>
  <line x1="430" y1="246" x2="596.7" y2="246" class="whisker"/>
  <text x="644" y="251" class="value">6</text>
  <text x="776" y="251" class="wrong">9</text>
  <text x="48" y="266" class="note">ablation</text>

  <text x="48" y="302" class="name">Full evidence, no signal line</text>
  <rect x="330" y="288" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="288" width="166.7" height="20" rx="10" fill="url(#barBase)" opacity="0.55"/>
  <line x1="396.7" y1="298" x2="563.3" y2="298" class="whisker"/>
  <text x="644" y="303" class="value">5</text>
  <text x="776" y="303" class="wrong">11</text>
  <text x="48" y="318" class="note">ablation: loses link_down and link_flaky</text>

  <line x1="48" y1="336" x2="852" y2="336" class="rule"/>

  <!-- ===== With retrieval ===== -->
  <text x="48" y="360" class="group">WITH RETRIEVAL (RAG)</text>

  <text x="48" y="388" class="name">+ top 3 past runs</text>
  <rect x="330" y="374" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="374" width="200" height="20" rx="10" fill="url(#barRag)"/>
  <line x1="430" y1="384" x2="596.7" y2="384" class="whisker"/>
  <text x="644" y="389" class="value">6</text>
  <text x="776" y="389" class="wrong">9</text>

  <text x="48" y="424" class="name">+ checks</text>
  <rect x="330" y="410" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="410" width="200" height="20" rx="10" fill="url(#barRag)"/>
  <line x1="430" y1="420" x2="596.7" y2="420" class="whisker"/>
  <text x="644" y="425" class="value">6</text>
  <text x="776" y="425" class="wrong">3</text>

  <text x="48" y="460" class="name">+ checks + disagreement gate</text>
  <rect x="330" y="446" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="446" width="166.7" height="20" rx="10" fill="url(#barRag)"/>
  <line x1="396.7" y1="456" x2="563.3" y2="456" class="whisker"/>
  <text x="644" y="461" class="value">5</text>
  <text x="776" y="461" class="wrong-zero">0</text>
  <text x="48" y="476" class="note">what the API runs</text>

  <line x1="48" y1="494" x2="852" y2="494" class="rule"/>

  <!-- ===== Majority vote ===== -->
  <text x="48" y="518" class="group">SAME PAST RUNS, MAJORITY VOTE — NO MODEL</text>

  <text x="48" y="546" class="name">Most common action of the 3</text>
  <rect x="330" y="532" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="532" width="300" height="20" rx="10" fill="url(#barVote)"/>
  <line x1="530" y1="542" x2="630" y2="542" class="whisker"/>
  <text x="644" y="547" class="value">9</text>
  <text x="776" y="547" class="wrong-zero">0</text>
  <text x="48" y="562" class="note">recall: every question had a past run of its own fault</text>

  <text x="48" y="598" class="name">+ checks + disagreement gate</text>
  <rect x="330" y="584" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="584" width="200" height="20" rx="10" fill="url(#barVote)"/>
  <line x1="430" y1="594" x2="596.7" y2="594" class="whisker"/>
  <text x="644" y="599" class="value">6</text>
  <text x="776" y="599" class="wrong-zero">0</text>
  <text x="48" y="614" class="note">the model's 5: it answers UNKNOWN on link_down</text>

  <line x1="48" y1="632" x2="852" y2="632" class="rule"/>

  <!-- ===== Held out ===== -->
  <text x="48" y="656" class="group">OWN FAULT HELD OUT — A FAILURE NEVER SEEN BEFORE</text>

  <text x="48" y="684" class="name">Retrieval + checks</text>
  <rect x="330" y="670" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="670" width="133.3" height="20" rx="10" fill="url(#barHeld)"/>
  <line x1="396.7" y1="680" x2="563.3" y2="680" class="whisker"/>
  <text x="644" y="685" class="value">4</text>
  <text x="776" y="685" class="wrong">12</text>

  <text x="48" y="720" class="name">Majority vote + checks</text>
  <rect x="330" y="706" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="706" width="133.3" height="20" rx="10" fill="url(#barVote)"/>
  <line x1="396.7" y1="716" x2="563.3" y2="716" class="whisker"/>
  <text x="644" y="721" class="value">4</text>
  <text x="776" y="721" class="wrong">6</text>

  <text x="48" y="756" class="name">Retrieval + both gates</text>
  <rect x="330" y="742" width="300" height="20" rx="10" class="track"/>
  <rect x="330" y="742" width="33.3" height="20" rx="10" fill="url(#barHeld)"/>
  <line x1="330" y1="752" x2="463.3" y2="752" class="whisker"/>
  <text x="644" y="757" class="value">1</text>
  <text x="776" y="757" class="wrong">3</text>
  <text x="668" y="757" class="note">vote 2, 0 wrong</text>
</svg>
