<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc">
  <title id="title">System overview</title>
  <desc id="desc">A new firmware release runs on a virtual bench, a signal generator and a spectrum analyzer joined by a cable, with faults injected on purpose. A 20-test regression suite measures it against limits. A passing run ships; a failing run goes to the triage assistant, which reads the evidence, finds the three closest past runs, asks a local model and checks its answer, then says whether the cause is the firmware, the bench or the test, and quotes what fixed it last time.</desc>
  <defs>
    <linearGradient id="ragStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="ragFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="rag-fill-a"/>
      <stop offset="1" class="rag-fill-b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #59636e; }
      .step { font-size: 11px; font-weight: 700; fill: #8c959f; letter-spacing: 0.08em; }
      .edge { stroke: #8c959f; stroke-width: 1.6; fill: none; }
      .arrowhead { fill: #8c959f; }
      .label { font-size: 11px; font-weight: 600; fill: #59636e; }
      .labelbox { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .rag-fill-a { stop-color: #f0f6ff; }
      .rag-fill-b { stop-color: #f6f0ff; }
      .ragtitle { font-size: 16px; font-weight: 700; fill: #0a3069; }
      .ragsub { font-size: 12px; fill: #3d5a80; }
      .chip { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .chiptext { font-size: 11.5px; font-weight: 600; fill: #1f2328; }
      .ship { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1; }
      .ship-text { font-size: 13px; font-weight: 600; fill: #0f5323; }
      .fw { fill: #ffebe9; stroke: #ff8182; stroke-width: 1; }
      .fw-title { font-size: 14px; font-weight: 700; fill: #82071e; }
      .bench { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
      .bench-title { font-size: 14px; font-weight: 700; fill: #0a3069; }
      .test { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; }
      .test-title { font-size: 14px; font-weight: 700; fill: #6c4400; }
      .outsub { font-size: 12px; fill: #59636e; }
      .lasttime { font-size: 12px; font-style: italic; fill: #59636e; }
      .instrument { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .instrument-text { font-size: 11px; font-weight: 600; fill: #1f2328; }
      .cable { stroke: #8c959f; stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
      @media (prefers-color-scheme: dark) {
        .card, .chip { fill: #161b22; stroke: #30363d; }
        .title, .chiptext, .instrument-text { fill: #e6edf3; }
        .sub, .label, .outsub, .lasttime { fill: #9198a1; }
        .step { fill: #6e7681; }
        .edge { stroke: #6e7681; }
        .arrowhead { fill: #6e7681; }
        .labelbox { fill: #0d1117; stroke: #30363d; }
        .rag-fill-a { stop-color: #0c2140; }
        .rag-fill-b { stop-color: #1c1538; }
        .ragtitle { fill: #cae8ff; }
        .ragsub { fill: #9ab3d1; }
        .ship { fill: #12261a; stroke: #2ea043; }
        .ship-text { fill: #7ee2a8; }
        .fw { fill: #2d1418; stroke: #da3633; }
        .fw-title { fill: #ffa198; }
        .bench { fill: #0c2d4d; stroke: #388bfd; }
        .bench-title { fill: #a5d6ff; }
        .test { fill: #2e2a12; stroke: #9e6a03; }
        .test-title { fill: #f2cc60; }
        .instrument { fill: #21262d; stroke: #30363d; }
        .cable { stroke: #6e7681; }
      }
    </style>
  </defs>

  <!-- Row 1: release, bench, suite, ship -->
  <g filter="url(#shadow)">
    <rect x="20" y="40" width="170" height="104" rx="14" class="card"/>
    <rect x="226" y="40" width="300" height="104" rx="14" class="card"/>
    <rect x="562" y="40" width="190" height="104" rx="14" class="card"/>
  </g>

  <text x="38" y="66" class="step">1 · RELEASE</text>
  <text x="38" y="92" class="title">New firmware</text>
  <text x="38" y="112" class="sub">a simulator version,</text>
  <text x="38" y="128" class="sub">e.g. 0.2.0-rc1</text>

  <text x="244" y="66" class="step">2 · VIRTUAL BENCH</text>
  <rect x="244" y="80" width="104" height="30" rx="8" class="instrument"/>
  <text x="296" y="99" text-anchor="middle" class="instrument-text">Signal generator</text>
  <path d="M348 95 H402" class="cable"/>
  <rect x="402" y="80" width="108" height="30" rx="8" class="instrument"/>
  <text x="456" y="99" text-anchor="middle" class="instrument-text">Spectrum analyzer</text>
  <text x="244" y="130" class="sub">SCPI over TCP · faults injected on purpose</text>

  <text x="580" y="66" class="step">3 · REGRESSION SUITE</text>
  <text x="580" y="92" class="title">20 tests</text>
  <text x="580" y="112" class="sub">every reading has a limit</text>
  <text x="580" y="128" class="sub">and a margin</text>

  <rect x="790" y="70" width="90" height="44" rx="12" class="ship"/>
  <text x="835" y="97" text-anchor="middle" class="ship-text">Ship</text>

  <path d="M190 92 H222" class="edge" marker-end="url(#arrow)"/>
  <path d="M526 92 H558" class="edge" marker-end="url(#arrow)"/>
  <path d="M752 92 H786" class="edge" marker-end="url(#arrow)"/>
  <text x="769" y="84" text-anchor="middle" class="label">pass</text>

  <!-- fail edge down to triage -->
  <path d="M657 144 V176 H230 V202" class="edge" marker-end="url(#arrow)"/>
  <rect x="420" y="165" width="40" height="22" rx="11" class="labelbox"/>
  <text x="440" y="180" text-anchor="middle" class="label">fail</text>

  <!-- Row 2: triage panel -->
  <rect x="20" y="206" width="470" height="170" rx="20" fill="url(#ragFill)" stroke="url(#ragStroke)" stroke-width="2.5"/>
  <text x="44" y="236" class="step">4 · TRIAGE ASSISTANT</text>
  <text x="44" y="262" class="ragtitle">Which of three causes, and what fixed it?</text>
  <g>
    <rect x="44" y="282" width="92" height="30" rx="15" class="chip"/>
    <text x="90" y="301" text-anchor="middle" class="chiptext">Evidence</text>
    <path d="M136 297 H148" class="edge" marker-end="url(#arrow)"/>
    <rect x="152" y="282" width="112" height="30" rx="15" class="chip"/>
    <text x="208" y="301" text-anchor="middle" class="chiptext">3 closest runs</text>
    <path d="M264 297 H276" class="edge" marker-end="url(#arrow)"/>
    <rect x="280" y="282" width="98" height="30" rx="15" class="chip"/>
    <text x="329" y="301" text-anchor="middle" class="chiptext">qwen2.5:3b</text>
    <path d="M378 297 H390" class="edge" marker-end="url(#arrow)"/>
    <rect x="394" y="282" width="72" height="30" rx="15" class="chip"/>
    <text x="430" y="301" text-anchor="middle" class="chiptext">Checks</text>
  </g>
  <text x="44" y="340" class="ragsub">Local models only · fixed list of actions · UNKNOWN when unsure</text>
  <text x="44" y="360" class="ragsub">Past runs are cited by id; their recorded fix is quoted, not generated</text>

  <!-- outcomes -->
  <path d="M490 291 H520" class="edge"/>
  <path d="M520 236 V346" class="edge"/>
  <path d="M520 236 H542" class="edge" marker-end="url(#arrow)"/>
  <path d="M520 291 H542" class="edge" marker-end="url(#arrow)"/>
  <path d="M520 346 H542" class="edge" marker-end="url(#arrow)"/>

  <rect x="546" y="212" width="334" height="48" rx="12" class="fw"/>
  <text x="564" y="241" class="fw-title">Firmware</text>
  <text x="650" y="241" class="outsub">a regression: block the release</text>

  <rect x="546" y="267" width="334" height="48" rx="12" class="bench"/>
  <text x="564" y="296" class="bench-title">Bench</text>
  <text x="650" y="296" class="outsub">cable, connector, calibration</text>

  <rect x="546" y="322" width="334" height="48" rx="12" class="test"/>
  <text x="564" y="351" class="test-title">Test</text>
  <text x="650" y="351" class="outsub">timeout or configuration</text>

  <text x="880" y="392" text-anchor="end" class="lasttime">each with what fixed it last time</text>
</svg>
