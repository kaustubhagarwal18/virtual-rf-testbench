<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" width="900" height="318" role="img" aria-labelledby="title desc">
  <title id="title">Faults solved and wrong answers by configuration</title>
  <desc id="desc">Error message only: 3 of 9 faults solved (95% interval 1 to 6), 18 of 27 answers wrong. Full evidence: 7 (4 to 8), 6 wrong. Plus the 3 closest past runs and checks: 6 (3 to 8), 3 wrong. Plus the disagreement gate, which is what the API runs: 5 (2 to 7), 0 wrong. Majority vote of the 3 past runs, with no model: 9 (6 to 9), 0 wrong.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-30%" width="110%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1f2328" flood-opacity="0.07"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .colhead { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #8c959f; }
      .name { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .count { font-size: 20px; font-weight: 800; }
      .interval { font-size: 12px; fill: #59636e; }
      .pill-text { font-size: 11px; font-weight: 700; fill: #0969da; }
      .pill { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
      .good { fill: #1a7f37; }
      .bad { fill: #cf222e; }
      .ink { fill: #1f2328; }
      .dot-on { fill: #4ac26b; }
      .dot-off { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
      .track { fill: #eff2f5; }
      .bar-bad { fill: #ff8182; }
      .accent { fill: #0969da; }
      @media (prefers-color-scheme: dark) {
        .panel { fill: #161b22; stroke: #30363d; }
        .colhead { fill: #6e7681; }
        .name, .ink { fill: #e6edf3; }
        .interval { fill: #9198a1; }
        .pill-text { fill: #58a6ff; }
        .pill { fill: #0c2d6b; stroke: #1f6feb; }
        .good { fill: #56d364; }
        .bad { fill: #ff7b72; }
        .dot-on { fill: #2ea043; }
        .dot-off { stroke: #30363d; }
        .track { fill: #21262d; }
        .bar-bad { fill: #da3633; }
        .accent { fill: #58a6ff; }
      }
    </style>
  </defs>

  <text x="40" y="34" class="colhead">CONFIGURATION</text>
  <text x="440" y="34" class="colhead">FAULTS SOLVED, OF 9</text>
  <text x="700" y="34" class="colhead">WRONG ANSWERS, OF 27</text>

  <g filter="url(#shadow)">
    <rect x="20" y="48" width="860" height="44" rx="12" class="panel"/>
    <rect x="20" y="100" width="860" height="44" rx="12" class="panel"/>
    <rect x="20" y="152" width="860" height="44" rx="12" class="panel"/>
    <rect x="20" y="204" width="860" height="44" rx="12" class="panel"/>
    <rect x="20" y="256" width="860" height="44" rx="12" class="panel"/>
  </g>
  <rect x="20" y="216" width="4" height="20" rx="2" class="accent"/>

  <!-- Row 1: error message only, 3 (1-6), 18 wrong -->
  <text x="40" y="75" class="name">Error message only</text>
  <g transform="translate(446 70)">
    <circle cx="0" r="6" class="dot-on"/><circle cx="18" r="6" class="dot-on"/><circle cx="36" r="6" class="dot-on"/>
    <circle cx="54" r="6" class="dot-off"/><circle cx="72" r="6" class="dot-off"/><circle cx="90" r="6" class="dot-off"/>
    <circle cx="108" r="6" class="dot-off"/><circle cx="126" r="6" class="dot-off"/><circle cx="144" r="6" class="dot-off"/>
  </g>
  <text x="610" y="77" class="count ink">3</text>
  <text x="628" y="76" class="interval">1–6</text>
  <text x="700" y="77" class="count bad">18</text>
  <rect x="736" y="65" width="135" height="10" rx="5" class="track"/>
  <rect x="736" y="65" width="90" height="10" rx="5" class="bar-bad"/>

  <!-- Row 2: full evidence, 7 (4-8), 6 wrong -->
  <text x="40" y="127" class="name">Full evidence</text>
  <g transform="translate(446 122)">
    <circle cx="0" r="6" class="dot-on"/><circle cx="18" r="6" class="dot-on"/><circle cx="36" r="6" class="dot-on"/>
    <circle cx="54" r="6" class="dot-on"/><circle cx="72" r="6" class="dot-on"/><circle cx="90" r="6" class="dot-on"/>
    <circle cx="108" r="6" class="dot-on"/><circle cx="126" r="6" class="dot-off"/><circle cx="144" r="6" class="dot-off"/>
  </g>
  <text x="610" y="129" class="count ink">7</text>
  <text x="628" y="128" class="interval">4–8</text>
  <text x="700" y="129" class="count bad">6</text>
  <rect x="736" y="117" width="135" height="10" rx="5" class="track"/>
  <rect x="736" y="117" width="30" height="10" rx="5" class="bar-bad"/>

  <!-- Row 3: + 3 closest past runs + checks, 6 (3-8), 3 wrong -->
  <text x="40" y="179" class="name">+ 3 closest past runs + checks</text>
  <g transform="translate(446 174)">
    <circle cx="0" r="6" class="dot-on"/><circle cx="18" r="6" class="dot-on"/><circle cx="36" r="6" class="dot-on"/>
    <circle cx="54" r="6" class="dot-on"/><circle cx="72" r="6" class="dot-on"/><circle cx="90" r="6" class="dot-on"/>
    <circle cx="108" r="6" class="dot-off"/><circle cx="126" r="6" class="dot-off"/><circle cx="144" r="6" class="dot-off"/>
  </g>
  <text x="610" y="181" class="count ink">6</text>
  <text x="628" y="180" class="interval">3–8</text>
  <text x="700" y="181" class="count bad">3</text>
  <rect x="736" y="169" width="135" height="10" rx="5" class="track"/>
  <rect x="736" y="169" width="15" height="10" rx="5" class="bar-bad"/>

  <!-- Row 4: + disagreement gate (the API), 5 (2-7), 0 wrong -->
  <text x="40" y="231" class="name">+ disagreement gate</text>
  <rect x="300" y="215" width="64" height="20" rx="10" class="pill"/>
  <text x="332" y="229" class="pill-text" text-anchor="middle">the API</text>
  <g transform="translate(446 226)">
    <circle cx="0" r="6" class="dot-on"/><circle cx="18" r="6" class="dot-on"/><circle cx="36" r="6" class="dot-on"/>
    <circle cx="54" r="6" class="dot-on"/><circle cx="72" r="6" class="dot-on"/><circle cx="90" r="6" class="dot-off"/>
    <circle cx="108" r="6" class="dot-off"/><circle cx="126" r="6" class="dot-off"/><circle cx="144" r="6" class="dot-off"/>
  </g>
  <text x="610" y="233" class="count ink">5</text>
  <text x="628" y="232" class="interval">2–7</text>
  <text x="700" y="233" class="count good">0</text>
  <rect x="736" y="221" width="135" height="10" rx="5" class="track"/>

  <!-- Row 5: majority vote, no model, 9 (6-9), 0 wrong -->
  <text x="40" y="283" class="name">Majority vote of the 3 past runs</text>
  <rect x="300" y="267" width="72" height="20" rx="10" class="pill"/>
  <text x="336" y="281" class="pill-text" text-anchor="middle">no model</text>
  <g transform="translate(446 278)">
    <circle cx="0" r="6" class="dot-on"/><circle cx="18" r="6" class="dot-on"/><circle cx="36" r="6" class="dot-on"/>
    <circle cx="54" r="6" class="dot-on"/><circle cx="72" r="6" class="dot-on"/><circle cx="90" r="6" class="dot-on"/>
    <circle cx="108" r="6" class="dot-on"/><circle cx="126" r="6" class="dot-on"/><circle cx="144" r="6" class="dot-on"/>
  </g>
  <text x="610" y="285" class="count ink">9</text>
  <text x="628" y="284" class="interval">6–9</text>
  <text x="700" y="285" class="count good">0</text>
  <rect x="736" y="273" width="135" height="10" rx="5" class="track"/>
</svg>
