<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="title desc">
  <title id="title">Triage pipeline</title>
  <desc id="desc">A failed run becomes evidence. Retrieval embeds the evidence and finds the three most similar resolved runs; if they disagree on the action the answer is UNKNOWN without asking the model. Otherwise the local model chooses one action, checks refuse a verdict that contradicts the run, and the result is a verdict or UNKNOWN with the reason.</desc>
  <defs>
    <linearGradient id="ragStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="ragFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="rag-fill-a"/>
      <stop offset="1" class="rag-fill-b"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f81f7"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12.5px; fill: #59636e; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #59636e; }
      .tagbox { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .chip { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .chiptext { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #1f2328; }
      .edge { stroke: #8c959f; stroke-width: 1.6; fill: none; }
      .edge-rag { stroke: #2f81f7; stroke-width: 2.2; fill: none; }
      .arrowhead { fill: #8c959f; }
      .label { font-size: 11px; font-weight: 600; fill: #59636e; }
      .labelbox { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .rag-fill-a { stop-color: #f0f6ff; }
      .rag-fill-b { stop-color: #f6f0ff; }
      .ragtitle { font-size: 16px; font-weight: 700; fill: #0a3069; }
      .ragsub { font-size: 12px; fill: #3d5a80; }
      .badge-text { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.08em; }
      .unknown { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; }
      .unknown-title { font-size: 13px; font-weight: 600; fill: #6c4400; }
      .unknown-sub { font-size: 11.5px; fill: #7d5a00; }
      .verdict { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1; }
      .verdict-title { font-size: 15px; font-weight: 600; fill: #0f5323; }
      .verdict-sub { font-size: 12.5px; fill: #1a7f37; }
      .db { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.2; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #161b22; stroke: #30363d; }
        .title { fill: #e6edf3; }
        .sub { fill: #9198a1; }
        .tag { fill: #9198a1; }
        .tagbox, .chip { fill: #21262d; stroke: #30363d; }
        .chiptext { fill: #e6edf3; }
        .edge { stroke: #6e7681; }
        .arrowhead { fill: #6e7681; }
        .label { fill: #9198a1; }
        .labelbox { fill: #0d1117; stroke: #30363d; }
        .rag-fill-a { stop-color: #0c2140; }
        .rag-fill-b { stop-color: #1c1538; }
        .ragtitle { fill: #cae8ff; }
        .ragsub { fill: #9ab3d1; }
        .unknown { fill: #2e2a12; stroke: #9e6a03; }
        .unknown-title { fill: #f2cc60; }
        .unknown-sub { fill: #d4b45a; }
        .verdict { fill: #12261a; stroke: #2ea043; }
        .verdict-title { fill: #7ee2a8; }
        .verdict-sub { fill: #56d364; }
        .db { fill: #0c2d4d; stroke: #388bfd; }
      }
    </style>
  </defs>

  <!-- RAG panel -->
  <rect x="410" y="104" width="470" height="318" rx="20" fill="url(#ragFill)" stroke="url(#ragStroke)" stroke-width="2.5"/>
  <rect x="432" y="122" width="44" height="22" rx="11" fill="url(#badge)"/>
  <text x="454" y="137.5" text-anchor="middle" class="badge-text">RAG</text>
  <text x="488" y="138" class="ragtitle">Retrieval</text>
  <text x="572" y="138" class="ragsub">past runs like this one</text>
  <rect x="702" y="125" width="162" height="18" rx="9" class="tagbox"/>
  <text x="783" y="138" text-anchor="middle" class="tag">retrieval.py · abstain.py</text>

  <!-- edges (drawn first, under the cards) -->
  <path class="edge" d="M200 112 V160" marker-end="url(#arrow)"/>
  <path class="edge" d="M200 238 V318" marker-end="url(#arrow)"/>
  <path class="edge-rag" d="M360 199 H426" marker-end="url(#arrowBlue)"/>
  <path class="edge-rag" d="M529 236 C529 254 600 252 600 266" marker-end="url(#arrowBlue)"/>
  <path class="edge-rag" d="M771 236 C771 254 700 252 700 266" marker-end="url(#arrowBlue)"/>
  <path class="edge-rag" d="M650 322 V344" marker-end="url(#arrowBlue)"/>
  <path class="edge-rag" d="M540 368 C470 368 430 368 364 368" marker-end="url(#arrowBlue)"/>
  <path class="edge" d="M650 392 V452" marker-end="url(#arrow)"/>
  <path class="edge" d="M200 416 V458" marker-end="url(#arrow)"/>
  <path class="edge" d="M200 524 V566" marker-end="url(#arrow)"/>
  <path class="edge" d="M360 492 C460 492 470 590 556 590" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <rect x="425" y="357" width="58" height="20" rx="10" class="labelbox"/>
  <text x="454" y="371" text-anchor="middle" class="label">agree</text>
  <rect x="616" y="412" width="68" height="20" rx="10" class="labelbox"/>
  <text x="650" y="426" text-anchor="middle" class="label">disagree</text>
  <rect x="165" y="535" width="70" height="20" rx="10" class="labelbox"/>
  <text x="200" y="549" text-anchor="middle" class="label">consistent</text>
  <rect x="424" y="536" width="82" height="20" rx="10" class="labelbox"/>
  <text x="465" y="550" text-anchor="middle" class="label">contradicts</text>

  <!-- Failed run -->
  <g filter="url(#shadow)">
    <rect x="40" y="36" width="320" height="76" rx="14" class="card"/>
  </g>
  <rect x="40" y="36" width="5" height="76" rx="2.5" fill="#8c959f"/>
  <text x="60" y="62" class="title">Failed run</text>
  <rect x="60" y="76" width="92" height="22" rx="6" class="chip"/>
  <text x="106" y="91" text-anchor="middle" class="chiptext">results.json</text>
  <rect x="160" y="76" width="70" height="22" rx="6" class="chip"/>
  <text x="195" y="91" text-anchor="middle" class="chiptext">logs.txt</text>
  <rect x="238" y="76" width="100" height="22" rx="6" class="chip"/>
  <text x="288" y="91" text-anchor="middle" class="chiptext">sequence.log</text>

  <!-- Evidence -->
  <g filter="url(#shadow)">
    <rect x="40" y="162" width="320" height="76" rx="14" class="card"/>
  </g>
  <rect x="40" y="162" width="5" height="76" rx="2.5" fill="#8957e5"/>
  <text x="60" y="188" class="title">Evidence</text>
  <rect x="266" y="174" width="80" height="18" rx="9" class="tagbox"/>
  <text x="306" y="187" text-anchor="middle" class="tag">evidence.py</text>
  <text x="60" y="208" class="sub">SCPI error first, then the first failure,</text>
  <text x="60" y="225" class="sub">its readings and the instrument versions</text>

  <!-- RAG: embed -->
  <g filter="url(#shadow)">
    <rect x="430" y="162" width="198" height="74" rx="14" class="card"/>
  </g>
  <text x="448" y="188" class="title">Embed</text>
  <text x="448" y="208" class="sub">nomic-embed-text, local</text>
  <text x="448" y="225" class="sub">evidence → one vector</text>

  <!-- RAG: history -->
  <g filter="url(#shadow)">
    <rect x="662" y="162" width="198" height="74" rx="14" class="card"/>
  </g>
  <ellipse cx="686" cy="186" rx="10" ry="3.5" class="db"/>
  <path d="M676 186 V198 A10 3.5 0 0 0 696 198 V186" class="db"/>
  <text x="704" y="190" class="title">History</text>
  <text x="680" y="212" class="sub">resolved runs, each with</text>
  <text x="680" y="228" class="sub">its cause, fix and action</text>

  <!-- RAG: top 3 -->
  <g filter="url(#shadow)">
    <rect x="540" y="268" width="220" height="54" rx="14" class="card"/>
  </g>
  <text x="650" y="291" text-anchor="middle" class="title">Top 3 past runs</text>
  <text x="650" y="310" text-anchor="middle" class="sub">by cosine, cited as past-3fa2c1d0</text>

  <!-- RAG: gate -->
  <g filter="url(#shadow)">
    <rect x="540" y="346" width="220" height="46" rx="23" class="card" stroke="#2f81f7" stroke-width="1.6"/>
  </g>
  <text x="650" y="374" text-anchor="middle" class="title" font-size="14">Do they agree on the action?</text>

  <!-- Generation -->
  <g filter="url(#shadow)">
    <rect x="40" y="320" width="320" height="96" rx="14" class="card"/>
  </g>
  <rect x="40" y="320" width="5" height="96" rx="2.5" fill="#bf3989"/>
  <text x="60" y="346" class="title">Generation</text>
  <rect x="200" y="332" width="148" height="18" rx="9" class="tagbox"/>
  <text x="274" y="345" text-anchor="middle" class="tag">prompt.py · answer.py</text>
  <text x="60" y="366" class="sub">qwen2.5:3b on local Ollama picks one action</text>
  <text x="60" y="383" class="sub">from a fixed list; its JSON schema allows</text>
  <text x="60" y="400" class="sub">citing only the past runs it was offered</text>

  <!-- Checks -->
  <g filter="url(#shadow)">
    <rect x="40" y="460" width="320" height="64" rx="14" class="card"/>
  </g>
  <rect x="40" y="460" width="5" height="64" rx="2.5" fill="#d4a72c"/>
  <text x="60" y="486" class="title">Checks</text>
  <rect x="274" y="472" width="72" height="18" rx="9" class="tagbox"/>
  <text x="310" y="485" text-anchor="middle" class="tag">checks.py</text>
  <text x="60" y="507" class="sub">does the verdict contradict the run's facts?</text>

  <!-- Verdict -->
  <g filter="url(#shadow)">
    <rect x="40" y="568" width="320" height="64" rx="32" class="verdict"/>
  </g>
  <text x="200" y="594" text-anchor="middle" class="verdict-title">Verdict</text>
  <text x="200" y="614" text-anchor="middle" class="verdict-sub">action · where · why · cited past runs</text>

  <!-- UNKNOWN: not asked -->
  <rect x="558" y="454" width="184" height="50" rx="25" class="unknown"/>
  <text x="650" y="475" text-anchor="middle" class="unknown-title">UNKNOWN</text>
  <text x="650" y="493" text-anchor="middle" class="unknown-sub">the model is never asked</text>

  <!-- UNKNOWN: with reason -->
  <rect x="558" y="566" width="184" height="50" rx="25" class="unknown"/>
  <text x="650" y="587" text-anchor="middle" class="unknown-title">UNKNOWN</text>
  <text x="650" y="605" text-anchor="middle" class="unknown-sub">with the check's reason</text>
</svg>
