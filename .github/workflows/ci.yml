name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
  SYFT_VERSION: "1.57.1"
  SYFT_SHA256: "bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c"
  # The triage job's local model server and the models triage/llm.py and triage/embed.py use.
  OLLAMA_VERSION: "0.40.14"
  OLLAMA_SHA256: "993e83d08c3d13d17c55009a3e2664c8a25445e644aec3a68bef5abb6abce67d"
  TRIAGE_MODEL: "qwen2.5:3b"
  EMBED_MODEL: "nomic-embed-text"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Pre-commit checks (whitespace, final newlines, YAML, TOML, then make lint)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Tests with an 80% coverage floor
        run: make test
      - name: Results summary on the run page
        if: ${{ !cancelled() }}
        run: make --silent summary >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports for the results comment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            reports/junit.xml
            reports/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  image:
    name: Image (build and scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build the simulator image
        run: make image
      - name: Record its ID, so later jobs can check they load this exact image
        run: docker image inspect --format '{{.Id}}' "$(make --silent image-name)" > image-id.txt
      - name: Install Trivy and Syft
        uses: ./.github/actions/install-scanners
        with:
          trivy-version: ${{ env.TRIVY_VERSION }}
          trivy-sha256: ${{ env.TRIVY_SHA256 }}
          syft-version: ${{ env.SYFT_VERSION }}
          syft-sha256: ${{ env.SYFT_SHA256 }}
      - name: Scan the image; fail on a fixable high or critical vulnerability
        run: >-
          ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          "$(make --silent image-name)"
      - name: Software bill of materials (SPDX JSON)
        run: >-
          ./syft scan "docker:$(make --silent image-name)"
          --output spdx-json=simulators.sbom.spdx.json
      - name: Save the image, so the bench tests and publishes exactly what was scanned
        run: docker save "$(make --silent image-name)" --output simulators.tar
      - name: Keep the image and its ID for the bench and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-image
          path: |
            simulators.tar
            image-id.txt
          if-no-files-found: error
          retention-days: 1
      - name: Keep the bill of materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-sbom
          path: simulators.sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  triage-image:
    name: Triage image (build and scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build the triage image
        run: make triage-image
      - name: Record its ID, so later jobs can check they load this exact image
        run: >-
          docker image inspect --format '{{.Id}}' "$(make --silent triage-image-name)"
          > image-id.txt
      - name: Install Trivy and Syft
        uses: ./.github/actions/install-scanners
        with:
          trivy-version: ${{ env.TRIVY_VERSION }}
          trivy-sha256: ${{ env.TRIVY_SHA256 }}
          syft-version: ${{ env.SYFT_VERSION }}
          syft-sha256: ${{ env.SYFT_SHA256 }}
      - name: Scan the image; fail on a fixable high or critical vulnerability
        run: >-
          ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          "$(make --silent triage-image-name)"
      - name: Software bill of materials (SPDX JSON)
        run: >-
          ./syft scan "docker:$(make --silent triage-image-name)"
          --output spdx-json=triage.sbom.spdx.json
      - name: Save the image, so the container tests and publish use exactly what was scanned
        run: docker save "$(make --silent triage-image-name)" --output triage.tar
      - name: Keep the image and its ID for the container tests and publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-image
          path: |
            triage.tar
            image-id.txt
          if-no-files-found: error
          retention-days: 1
      - name: Keep the bill of materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-sbom
          path: triage.sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  triage-smoke:
    name: Triage image (container tests)
    needs: [triage-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Fetch the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-image
      - name: Load it, checking it is the image that was scanned; nothing is rebuilt
        id: triage-image
        uses: ./.github/actions/load-image
        with:
          archive: triage.tar
          id-file: image-id.txt
          name-target: triage-image-name
      - name: Container tests against that image, by ID
        env:
          TRIAGE_IMAGE: ${{ steps.triage-image.outputs.id }}
        run: make triage-smoke

  bench:
    name: Bench (containers)
    needs: [image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Fetch the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: simulator-image
      - name: Load it, checking it is the image that was scanned
        uses: ./.github/actions/load-image
        with:
          archive: simulators.tar
          id-file: image-id.txt
          name-target: image-name
      - name: Start the bench from it, without rebuilding
        run: make bench-up BENCH_BUILD=--no-build
      - name: Bench suite against the containers
        run: make bench-test
      - name: Results summary on the run page
        if: ${{ !cancelled() && hashFiles('reports/bench-junit.xml') != '' }}
        run: make --silent bench-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report for the results comment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-reports
          path: reports/bench-junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Simulator logs, if anything failed
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker compose logs --no-color | tee reports/bench-logs.txt
      - name: Save the failed run for the triage job
        if: ${{ failure() && hashFiles('reports/bench-results.json') != '' }}
        run: uv run python -m tools.save_failed_run reports/bench-results.json --out reports/failed-run
      - name: Keep the failed run for the triage job
        if: ${{ failure() && hashFiles('reports/failed-run/results.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-run
          path: reports/failed-run
          retention-days: 7
      - name: Stop the bench
        if: ${{ always() }}
        run: make bench-down

  triage:
    name: Triage (allowed to fail)
    needs: [bench]
    # Only a failed bench has something to triage; a passing pull request never pays for it.
    if: ${{ !cancelled() && needs.bench.result == 'failure' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Fetch the failed run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # No artifact means the bench failed before the suite ran; the section says so.
        continue-on-error: true
        with:
          name: failed-run
          path: reports/failed-run
      - name: Restore Ollama and its models
        id: ollama-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/ollama
            ~/.ollama/models
          key: ollama-${{ env.OLLAMA_VERSION }}-${{ env.TRIAGE_MODEL }}-${{ env.EMBED_MODEL }}
      - name: Install Ollama (pinned version, checksum verified, CPU libraries only)
        if: ${{ steps.ollama-cache.outputs.cache-hit != 'true' }}
        run: |
          archive=ollama-linux-amd64.tar.zst
          curl -sSfL -o "$archive" \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/${archive}"
          echo "${OLLAMA_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p ~/ollama
          tar --zstd -xf "$archive" -C ~/ollama \
            --exclude='lib/ollama/cuda_*' --exclude='lib/ollama/rocm*' --exclude='lib/ollama/vulkan*'
          rm "$archive"
      - name: Start Ollama on localhost
        run: |
          ~/ollama/bin/ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && exit 0
            sleep 1
          done
          echo "Ollama didn't answer on 127.0.0.1:11434 within 30 s"; cat ollama.log; exit 1
      - name: Pull the models, when the cache didn't have them
        if: ${{ steps.ollama-cache.outputs.cache-hit != 'true' }}
        run: |
          ~/ollama/bin/ollama pull "$TRIAGE_MODEL"
          ~/ollama/bin/ollama pull "$EMBED_MODEL"
      - name: Triage the failed run
        run: >-
          uv run python -m tools.ci_triage reports/failed-run
          --out reports/triage/triage.md --model "$TRIAGE_MODEL"
      - name: Verdict on the run page
        if: ${{ !cancelled() && hashFiles('reports/triage/triage.md') != '' }}
        run: cat reports/triage/triage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the verdict for the results comment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-reports
          path: reports/triage/triage.md
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish image (${{ matrix.image.repository }})
    # Both images publish only once both have passed their own tests and every other check.
    # The bench's triage is advisory and allowed to fail, so it is never a gate here.
    needs: [lint, test, secrets, image, bench, triage-image, triage-smoke]
    # Only main is published: a pull request's images are built and scanned, never pushed.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - artifact: simulator-image
            archive: simulators.tar
            name-target: image-name
            repository: virtual-rf-testbench-simulators
          - artifact: triage-image
            archive: triage.tar
            name-target: triage-image-name
            repository: virtual-rf-testbench-triage
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Fetch the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.image.artifact }}
      - name: Load it, checking it is the image that was scanned and tested
        id: loaded
        uses: ./.github/actions/load-image
        with:
          archive: ${{ matrix.image.archive }}
          id-file: image-id.txt
          name-target: ${{ matrix.image.name-target }}
      - name: Push it to GitHub Container Registry, tagged with its version and commit
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_IMAGE: ${{ steps.loaded.outputs.image }}
          REPOSITORY: ${{ matrix.image.repository }}
        # Tags are immutable by convention (version-commit), so a deployment pins one exactly;
        # nothing is ever tagged latest.
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          remote="ghcr.io/${owner}/${REPOSITORY}:${LOCAL_IMAGE##*:}-${GITHUB_SHA::7}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL_IMAGE" "$remote"
          docker push "$remote"
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "$remote" | grep -m 1 "^ghcr.io/${owner}/${REPOSITORY}@" || true)
          if [ -z "$digest" ]; then
            echo "::warning::docker didn't report a digest for $remote; the push log above has it"
            digest="not reported"
          fi
          echo "Pushed \`$remote\` as \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the full git history for secrets, including merge commits
        run: >-
          ./gitleaks git --redact --verbose
          --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=first-parent" .

  report:
    name: Results comment
    needs: [lint, test, image, bench, secrets, triage, triage-image, triage-smoke]
    # Pull requests from this repository only: GitHub gives fork pull requests a read-only token.
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Fetch the test and bench reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A job that failed before writing reports leaves nothing to fetch; the comment says so.
        continue-on-error: true
        with:
          pattern: "*-reports*"
          path: reports
      - name: Build the comment
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          BENCH_RESULT: ${{ needs.bench.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          TRIAGE_IMAGE_RESULT: ${{ needs.triage-image.result }}
          TRIAGE_SMOKE_RESULT: ${{ needs.triage-smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        # The test-reports folder name follows the Python version in the test job's matrix.
        # A failed bench was triaged; a missing verdict file then means the triage job failed.
        run: |
          triage=()
          if [ "$BENCH_RESULT" = failure ]; then
            triage=(--triage reports/triage-reports/triage.md)
          fi
          uv run python -m tools.pr_comment \
            reports/test-reports-3.13/junit.xml reports/bench-reports/bench-junit.xml \
            --coverage reports/test-reports-3.13/coverage.xml --coverage-floor 80 \
            --job "Lint=$LINT_RESULT" --job "Test (Python 3.13)=$TEST_RESULT" \
            --job "Image (build and scan)=$IMAGE_RESULT" \
            --job "Bench (containers)=$BENCH_RESULT" \
            --job "Triage image (build and scan)=$TRIAGE_IMAGE_RESULT" \
            --job "Triage image (container tests)=$TRIAGE_SMOKE_RESULT" \
            --job "Secret scan=$SECRETS_RESULT" \
            --run-url "$RUN_URL" --commit "$COMMIT_SHA" "${triage[@]}" \
            > reports/comment.md
      - name: Post the comment, or update the one posted before
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The comment's first line is its marker; an earlier comment with the same one is updated.
        run: |
          MARKER=$(head -n 1 reports/comment.md)
          export MARKER
          comment_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id')
          comment_id=${comment_ids%%$'\n'*}
          if [ -n "$comment_id" ]; then
            gh api --method PATCH --silent \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@reports/comment.md
          else
            gh api --method POST --silent \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@reports/comment.md
          fi
