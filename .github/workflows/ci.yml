name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Pre-commit checks (whitespace, final newlines, YAML, TOML, then make lint)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Tests with an 80% coverage floor
        run: make test
      - name: Results summary on the run page
        if: ${{ !cancelled() }}
        run: make --silent summary >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports for the results comment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            reports/junit.xml
            reports/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  bench:
    name: Bench (containers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Build the simulator image and start the bench
        run: make bench-up
      - name: Bench suite against the containers
        run: make bench-test
      - name: Results summary on the run page
        if: ${{ !cancelled() && hashFiles('reports/bench-junit.xml') != '' }}
        run: make --silent bench-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report for the results comment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-reports
          path: reports/bench-junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Simulator logs, if anything failed
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Stop the bench
        if: ${{ always() }}
        run: make bench-down

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the full git history for secrets, including merge commits
        run: >-
          ./gitleaks git --redact --verbose
          --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=first-parent" .

  report:
    name: Results comment
    needs: [lint, test, bench, secrets]
    # Pull requests from this repository only: GitHub gives fork pull requests a read-only token.
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Fetch the test and bench reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A job that failed before writing reports leaves nothing to fetch; the comment says so.
        continue-on-error: true
        with:
          pattern: "*-reports*"
          path: reports
      - name: Build the comment
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BENCH_RESULT: ${{ needs.bench.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        # The test-reports folder name follows the Python version in the test job's matrix.
        run: >-
          uv run python -m tools.pr_comment
          reports/test-reports-3.13/junit.xml reports/bench-reports/bench-junit.xml
          --coverage reports/test-reports-3.13/coverage.xml --coverage-floor 80
          --job "Lint=$LINT_RESULT" --job "Test (Python 3.13)=$TEST_RESULT"
          --job "Bench (containers)=$BENCH_RESULT" --job "Secret scan=$SECRETS_RESULT"
          --run-url "$RUN_URL" --commit "$COMMIT_SHA"
          > reports/comment.md
      - name: Post the comment, or update the one posted before
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The comment's first line is its marker; an earlier comment with the same one is updated.
        run: |
          MARKER=$(head -n 1 reports/comment.md)
          export MARKER
          comment_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id')
          comment_id=${comment_ids%%$'\n'*}
          if [ -n "$comment_id" ]; then
            gh api --method PATCH --silent \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@reports/comment.md
          else
            gh api --method POST --silent \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@reports/comment.md
          fi
