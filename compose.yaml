# The simulated bench: a signal generator and a spectrum analyzer on one network.
# Start with make bench-up, stop with make bench-down. Ports are published on localhost only.

name: virtual-rf-bench

x-simulator: &simulator
  image: virtual-rf-testbench-simulators:${FIRMWARE_VERSION:-dev}
  build:
    context: .
    args:
      FIRMWARE_VERSION: ${FIRMWARE_VERSION:-}
      REVISION: ${REVISION:-unknown}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  restart: "no"

services:
  signal-generator:
    <<: *simulator
    command: ["python", "-m", "simulators.signal_generator", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5025:5025"
      - "127.0.0.1:5125:5125"

  spectrum-analyzer:
    <<: *simulator
    command:
      - python
      - -m
      - simulators.spectrum_analyzer
      - --host
      - 0.0.0.0
      - --generator-admin
      - signal-generator:5125
    ports:
      - "127.0.0.1:5026:5025"
      - "127.0.0.1:5126:5126"
    depends_on:
      signal-generator:
        condition: service_healthy

  # The triage API, under its own profile: make image and make bench-up never build or start
  # it. make triage-image builds it and make triage-up starts it. It talks to the Ollama on
  # this machine through host.docker.internal; added runs and cached vectors persist in the
  # triage-history volume (docs/INFRASTRUCTURE.md).
  triage:
    profiles: [triage]
    image: virtual-rf-testbench-triage:${FIRMWARE_VERSION:-dev}
    build:
      context: .
      target: triage-runtime
      args:
        FIRMWARE_VERSION: ${FIRMWARE_VERSION:-}
        REVISION: ${REVISION:-unknown}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: "no"
    environment:
      TRIAGE_OLLAMA_HOST: ${TRIAGE_OLLAMA_HOST:-http://host.docker.internal:11434}
    # Docker Desktop resolves host.docker.internal itself; this line does the same on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - triage-history:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  triage-history:
